name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # STORIA COMPLETA, e non e' un dettaglio: `check-segreti.sh` cerca anche nei
          # commit passati (`git log --all`), perche' un segreto tolto oggi resta in quelli
          # di ieri. Con il clone superficiale predefinito quella ricerca non trova mai
          # niente e il controllo passa in silenzio dicendo il contrario di cio' che sa.
          fetch-depth: 0

      # I SEGRETI SI FERMANO PRIMA DI TUTTO IL RESTO, perche' un segreto committato una
      # volta resta nella storia per sempre: toglierlo dopo non lo toglie da li'.
      #
      # Lo script esisteva gia' da mesi e non lo eseguiva nessuno automaticamente. Non ha
      # visto le tre evidenze documentali tracciate da git perche' andava lanciato a mano,
      # e a mano non lo lanciava nessuno.
      - name: Nessun segreto tracciato
        run: ./deploy/check-segreti.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Il catalogo dei controlli deve restare tracciabile al prototipo: se qualcuno lo
      # modifica a mano invece di rigenerarlo, la build si ferma qui.
      - name: Catalogo allineato al prototipo
        run: pnpm seed:check

      # Stesso principio per i font del documento: se il modulo incorporato non corrisponde
      # più ai file di @fontsource, il PDF si stamperebbe con un carattere di ripiego sulla
      # macchina del cliente, e nessuno se ne accorgerebbe fino a quel momento.
      - name: Font del documento incorporati
        run: pnpm --filter web font:check

      - name: Formattazione
        run: pnpm format

      - name: Tipi
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Il Chromium non è importato da nessun modulo: se una rotta PDF non è dichiarata in
      # outputFileTracingIncludes, la build resta verde e la rotta risponde 500 solo in
      # produzione. È successo due volte. Ora si legge la tracciatura invece di scoprirlo.
      - name: Rotte PDF complete di Chromium
        run: pnpm --filter web pdf:traccia

      # Il motore è la fonte di verità dei calcoli: non deve poter acquisire dipendenze
      # a runtime, o smette di essere portabile e verificabile in isolamento.
      - name: Il motore resta senza dipendenze
        run: |
          if node -e "const p=require('./packages/engine/package.json');process.exit(p.dependencies&&Object.keys(p.dependencies).length?1:0)"; then
            echo "ok: nessuna dipendenza a runtime"
          else
            echo "::error::packages/engine ha acquisito dipendenze a runtime"; exit 1
          fi
