      <h2 id="s1">2. Contesto Normativo e Perimetro</h2>
      <h3>2.1 Cliente e Perimetro Organizzativo</h3>
      <p><strong>${t}</strong> opera quale Titolare autonomo per i trattamenti HR, clienti, fornitori, marketing B2B, videosorveglianza e whistleblowing, e quale Responsabile ex art. 28 per servizi erogati a terzi. Il perimetro include ${F.length+A.length} flussi di dati mappati, con prevalenza di dati comuni (art. 6), dati particolari potenzialmente rilevanti (art. 9) per sorveglianza sanitaria, e dati giudiziari in contesti di contenzioso giuslavoristico (art. 10). Basi giuridiche prevalenti: art. 6.1.b (contratto), 6.1.c (obbligo legale), 6.1.f (legittimo interesse documentato via LIA task T10) e 6.1.a (consenso marketing, task T06, T19).</p>
      <h3>2.2 Ruoli e Responsabilità ex artt. 24, 28, 37-39</h3>
      <ul>
        <li><strong>Titolare (art. 24, accountability):</strong> responsabile di implementare misure tecniche e organizzative adeguate (MTOM art. 32), tenere registro art. 30.1 (T01), eseguire DPIA art. 35 (T03), gestire data breach artt. 33-34 (T04, T17), aggiornare informative artt. 13-14 (T05), mappare consensi art. 7 (T06, T19). Compliance attuale ${f.perRole("Titolare")}% - gap principale: mancato aggiornamento continuo registro e trasferimenti extra UE.</li>
        <li><strong>Responsabile (art. 28):</strong> deve tenere registro art. 30.2 (R01), garantire sicurezza ex art. 32 (R02, R07), disciplinare sub-responsabili ex art. 28.2 (R03), notificare breach al Titolare entro 24-72h ex art. 33.2 (R04), assistere esercizio diritti ex art. 28.3.e (R05). Compliance ${f.perRole("Responsabile")}% - criticità: R01 e R04 in ritardo, rischio inadempimento contrattuale e art. 83.4.a.</li>
        <li><strong>DPO (artt. 37-39):</strong> sorveglianza compliance ex art. 39.1.b (D01, D09, D12), pareri DPIA ex art. 35 (D02), registro pareri (D03), formazione ex art. 39.1.b (D04), punto contatto Garante ex art. 39.1.e (D05), report annuale (D06). Compliance ${f.perRole("DPO")}% - punto di forza: nomina e comunicazione al Garante perfezionate; debolezza: formazione non tracciata (D04) e piano sorveglianza in ritardo (D01).</li>
      </ul>
      <h3>2.3 Basi Giuridiche e Principi ex art. 5</h3>
      <p>L'analisi ha verificato i principi di liceità, correttezza, trasparenza (art. 5.1.a - informative T05), limitazione finalità (5.1.b - registro T01), minimizzazione (5.1.c - LIA T10), esattezza (5.1.d - procedure rettifica T07), limitazione conservazione (5.1.e - policy T09), integrità e riservatezza (5.1.f - misure art. 32 T08). Gap rilevato su 5.1.e (policy conservazione T09 da formalizzare) e 5.2 accountability (registro non aggiornato).</p>

      <h2 id="s2">3. Metodologia di Assessment</h2>
      <p>Metodologia risk-based conforme a linee guida EDPB su accountability e ISO 27701:2023. Ogni task è pesato per <strong>priorità (Critica=1.5x, Alta=1.2x, Media=1x)</strong> e <strong>rischio intrinseco (1-10)</strong>. Compliance % = task completati / totali. Esposizione sanzionatoria stimata = f(ritardi * €12.5k + critici aperti * €22k + rischioTot*€850) con correttivo fatturato. Fonte: provvedimenti Garante 2022-2024 (media sanzioni €${Math.round(f.stimaSanzione/f.tot).toLocaleString("it-IT")} per violazione art. 30, €${Math.round(f.stimaSanzione*1.4/f.tot).toLocaleString("it-IT")} per omessa DPIA). Limiti: stima non vincolante, non include danno reputazionale, costi contenzioso, azioni collettive art. 80.</p>
